name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build AikenVPN (Windows x64)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Test
        run: go test ./...

      # OpenVPN GPL-бинарники не хранятся в репо и не скачиваются в CI.
      # Сборка без -WithOpenVPN: OpenVPN работает через системный fallback.
      # Для полной сборки с встроенным OpenVPN используйте build.ps1 локально.
      - name: Build AikenVPN.exe
        shell: pwsh
        run: wails build -clean -platform windows/amd64

      - name: Get version
        id: version
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $ver = $tag } else { $ver = "dev-" + $env:GITHUB_SHA.Substring(0,7) }
          "VERSION=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          $notes = "docs/RELEASE-$ver.md"
          if (Test-Path -LiteralPath $notes) {
            "NOTES=$notes" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }

      - name: Rename artifact
        id: artifact
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          $src = "build\bin\AikenVPN.exe"
          $dst = "AikenVPN-$env:VERSION-windows-amd64.exe"
          Move-Item -LiteralPath $src -Destination $dst
          $mb = [math]::Round((Get-Item $dst).Length / 1MB, 1)
          Write-Host "Artifact: $dst ($mb MB)"
          "ARTIFACT=$dst" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          $digest = (Get-FileHash -LiteralPath $dst -Algorithm SHA256).Hash.ToLowerInvariant()
          "$digest  $dst" | Set-Content -LiteralPath SHA256SUMS.txt -Encoding ascii

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: "AikenVPN ${{ steps.version.outputs.VERSION }}"
          body_path: ${{ steps.version.outputs.NOTES }}
          generate_release_notes: ${{ steps.version.outputs.NOTES == '' }}
          files: |
            ${{ steps.artifact.outputs.ARTIFACT }}
            SHA256SUMS.txt
          fail_on_unmatched_files: true
          draft: false
          prerelease: false

      - name: Upload artifact (non-tag builds)
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: AikenVPN-${{ steps.version.outputs.VERSION }}-windows-amd64
          path: |
            ${{ steps.artifact.outputs.ARTIFACT }}
            SHA256SUMS.txt
          retention-days: 14
