name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build AikenVPN (Windows x64)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      # OpenVPN GPL-бинарники не хранятся в репо и не скачиваются в CI.
      # Сборка без -WithOpenVPN: OpenVPN работает через системный fallback.
      # Для полной сборки с встроенным OpenVPN используйте build.ps1 локально.
      - name: Build AikenVPN.exe
        shell: pwsh
        run: wails build -clean -platform windows/amd64

      - name: Get version
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -match '^v') { $ver = $tag } else { $ver = "dev-" + "${{ github.sha }}".Substring(0,7) }
          "VERSION=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Rename artifact
        id: artifact
        shell: pwsh
        run: |
          $src = "build\bin\AikenVPN.exe"
          $dst = "AikenVPN-${{ steps.version.outputs.VERSION }}-windows-amd64.exe"
          Move-Item $src $dst
          $mb = [math]::Round((Get-Item $dst).Length / 1MB, 1)
          Write-Host "Artifact: $dst ($mb MB)"
          "ARTIFACT=$dst" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: "AikenVPN ${{ steps.version.outputs.VERSION }}"
          body: |
            ## AikenVPN ${{ steps.version.outputs.VERSION }}

            **Скачайте `AikenVPN-*.exe` и запустите — установка не нужна.**

            ### Что нового в 2.4.x
            - 🪟 **Один экземпляр:** повторный запуск exe больше не создаёт второй процесс — открывается окно уже работающего приложения. Ссылки `jamvpn://` и файлы конфигов, переданные при повторном запуске, импортируются на лету.
            - 🖱️ **Трей:** клик по иконке (одинарный или двойной) открывает окно — меню на правой кнопке больше не обязательно. Иконка снова меняет цвет по состоянию соединения.
            - 🚪 **Корректный выход:** при активном VPN — подтверждение, затем реальное отключение (снятие прокси и маршрутов) перед завершением. Процесс больше не «зависает» в диспетчере задач.
            - 🎨 **Новый дизайн:** aurora-фон, стеклянные панели, плавные анимации переходов, обновлённые карточки, кнопка подключения с живым кольцом статуса.
            - ▶️ **Первый запуск:** окно открывается сразу; свёрнутый старт — только при автозапуске с Windows (если включён в настройках).
            - 🔗 Импорт share-ссылок `jamvpn://` из текста и QR; исправлен импорт полного экспорта `{"version":2,"profiles":[...]}`.
            - 🛠️ Настройки «действие при закрытии» и «запускать свёрнутым» теперь действительно работают; устранены гонки в трее и при завершении.
            - ✅ Добавлены unit-тесты (парсеры, хранилище профилей и настроек).
            - 📛 Приложение переименовано в **AikenVPN** (профили и настройки предыдущих версий подхватываются автоматически).

            ### Встроенные протоколы
            - ✅ WireGuard (wireguard-go + wintun — встроен)
            - ✅ VMess / VLESS / Trojan / Shadowsocks (xray-core — встроен)
            - ✅ L2TP / IKEv2 / SSTP / PPTP (Windows RAS API — системный)
            - ⚙️ OpenVPN — работает при наличии установленного OpenVPN, либо соберите локально с `-WithOpenVPN`

            ### Требования
            - Windows 10 / 11 x64
            - Права администратора (WireGuard, L2TP)
          files: ${{ steps.artifact.outputs.ARTIFACT }}
          draft: false
          prerelease: false

      - name: Upload artifact (non-tag builds)
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: JamVPN-${{ steps.version.outputs.VERSION }}-windows-amd64
          path: ${{ steps.artifact.outputs.ARTIFACT }}
          retention-days: 14
